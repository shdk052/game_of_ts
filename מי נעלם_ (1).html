<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מי נעלם?</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1020;--panel:#171b33;--p2:#20264a;--tx:#eef0ff;--mu:#9aa1c7;--acc:#7c5cff;--acc2:#22d3ee;--ok:#34d399;--bad:#fb7185;--gold:#fbbf24;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:radial-gradient(900px 500px at 85% -10%,#2b1f6b55,transparent),radial-gradient(800px 500px at 0 110%,#0e5a7a44,transparent),var(--bg);color:var(--tx);font-family:'Rubik','Segoe UI',Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#app{height:100%;display:flex;flex-direction:column;max-width:1500px;margin:0 auto;padding:10px 12px;gap:8px}
.hud{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.brand{font-weight:800;font-size:1.25rem;margin-inline-end:auto;background:linear-gradient(90deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--mu);white-space:nowrap}
.chip b{color:var(--tx);font-weight:700}
.chip.hot b{color:var(--gold)}
.btn{background:var(--acc);padding:9px 18px;border-radius:12px;font-weight:700;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--p2)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.bar{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:8px 14px;min-height:50px}
#status{font-weight:600;flex:1}
#tm{display:flex;align-items:center;gap:10px;flex:2}
#tbw{flex:1;height:10px;background:var(--p2);border-radius:9px;overflow:hidden}
#tb{height:100%;width:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));transform-origin:right;border-radius:9px}
#tn{font-weight:800;font-size:1.6rem;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
#tm.low #tn{color:var(--bad)}#tm.low #tb{background:var(--bad)}
#stage{flex:1;min-height:240px;position:relative;direction:ltr;overflow:hidden;border-radius:18px;background:linear-gradient(160deg,#141936,#10142b);border:1px solid #ffffff12;box-shadow:inset 0 0 60px #0006}
.ch{position:absolute;left:0;top:0;width:var(--bw);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform var(--t,.9s) cubic-bezier(.65,0,.25,1),scale .6s cubic-bezier(.3,1.5,.5,1),opacity .6s,rotate .8s,filter .8s;will-change:transform;pointer-events:none}
.ch.in{scale:0;opacity:0}
.ch.gone{scale:0;opacity:0;rotate:240deg;filter:blur(5px)}
.ch.rev{z-index:3}.ch.rev .av{filter:drop-shadow(0 0 6px var(--ok)) drop-shadow(0 0 18px var(--ok))}
.av{width:var(--d);height:var(--d);flex:none;filter:drop-shadow(0 4px 8px #0008)}
.av img{width:100%;height:100%;display:block;object-fit:contain}
.nm{font-size:var(--fs);font-weight:600;white-space:nowrap;direction:rtl;text-shadow:0 1px 3px #000}
.nonm .nm{display:none}
.float .av{animation:bob 2.8s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bob{50%{translate:0 -5px}}
#ans{background:var(--panel);border-radius:16px;padding:12px;max-height:38vh;overflow:auto}
#ans h2{margin:0 0 8px;font-size:1.1rem}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.opt{background:var(--p2);border:2px solid transparent;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateY(-2px)}
.opt.sel{border-color:var(--acc2);background:#26305e}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}.opt.miss{border-color:var(--gold);border-style:dashed}
.opt .av{--d:58px}
#res{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#res .msg{flex:1;min-width:200px}
#res .msg b{display:block;font-size:1.2rem;margin-bottom:2px}
.good b{color:var(--ok)}.badm b{color:var(--bad)}
.ov{position:fixed;inset:0;background:#080a16d9;backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:10;overflow:auto}
.card{background:var(--panel);border-radius:22px;padding:22px;max-width:560px;width:100%;box-shadow:0 20px 60px #000a;border:1px solid #ffffff14}
.card h1{margin:0 0 4px;font-size:2.1rem;font-weight:800}
.card p{color:var(--mu);margin:4px 0 12px;line-height:1.55}
.lvs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lv{background:var(--p2);border:2px solid transparent;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lv span{font-size:.78rem;color:var(--mu)}.lv small{font-size:.7rem;color:var(--gold)}
.lv.on{border-color:var(--acc);background:#2a2766}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.row label{min-width:150px;font-weight:500}
input[type=range]{flex:1;accent-color:var(--acc);min-width:120px}
.start{width:100%;font-size:1.2rem;padding:13px;margin-top:8px}
.big{font-size:2.6rem;font-weight:800;color:var(--gold);text-align:center;margin:6px 0}
.hide{display:none!important}
@media(max-width:600px){.lvs{grid-template-columns:repeat(3,1fr)}.card h1{font-size:1.7rem}.chip{padding:4px 9px;font-size:.78rem}#ans{max-height:42vh}}
@media(prefers-reduced-motion:reduce){.float .av{animation:none}}
</style>
</head>
<body>
<div id="app">
 <div class="hud">
  <div class="brand">מי נעלם?</div>
  <div class="chip">ניקוד: <b id="sc">0</b></div>
  <div class="chip">סיבוב: <b id="rd">1</b></div>
  <div class="chip">רמה: <b id="lvn"></b></div>
  <div class="chip hot">קומבו: <b id="cb">0</b></div>
  <div class="chip">חיים: <b id="lf"></b></div>
  <div class="chip">שיא: <b id="bs">0</b></div>
  <button class="btn ghost sm" id="mt" aria-label="השתקה והפעלת צלילים">🔊</button>
  <button class="btn ghost sm" id="mn">תפריט</button>
 </div>
 <div class="bar">
  <div id="status"></div>
  <div id="tm" class="hide"><div id="tbw"><div id="tb"></div></div><div id="tn">0</div><button class="btn sm" id="skip">אני מוכן!</button></div>
 </div>
 <div id="stage"></div>
 <div id="ans" class="hide"><h2 id="q"></h2><div id="opts" class="opts"></div><div id="res" class="hide"><div class="msg" id="msg"></div><button class="btn" id="nx">הסיבוב הבא</button></div></div>
</div>

<div class="ov" id="menu"><div class="card">
 <h1>מי נעלם?</h1>
 <p>הדמויות מופיעות על המסך – זכרו את כולן! אחר כך הן מתערבבות, ודמות אחת (או יותר) נעלמת. תצטרכו לזהות מי חסר. כל תשובה נכונה מעלה את הקומבו, וכל טעות עולה בחיים.</p>
 <div class="lvs" id="lvs"></div>
 <div class="row"><label id="obl"></label><input type="range" id="obs" min="5" max="180" step="5" value="60"></div>
 <div class="row"><label id="cnl"></label><input type="range" id="cnt" disabled></div>
 <div class="row"><label for="auto">כמות אוטומטית</label><input type="checkbox" id="auto" checked><span style="color:var(--mu);font-size:.85rem">גדלה ככל שמתקדמים</span></div>
 <div class="row"><label id="mvlb"></label><input type="range" id="mvl" min="0" max="100"></div>
 <div class="row"><label id="svlb"></label><input type="range" id="svl" min="0" max="100"></div>
 <div class="row"><label for="mute">השתקת כל הצלילים</label><input type="checkbox" id="mute"></div>
 <button class="btn start" id="go">התחלת משחק</button>
</div></div>

<div class="ov hide" id="over"><div class="card" style="text-align:center">
 <h1>המשחק נגמר</h1>
 <p id="ovt"></p><div class="big" id="ovs"></div><p id="ovb"></p>
 <button class="btn start" id="again">משחק חדש</button>
 <button class="btn ghost start" id="tomenu">חזרה להגדרות</button>
</div></div>

const A=(()=>{
 const v={m:.6,s:.8,mute:false};let ctx,MB,SB,rev,nb,cur=null,want='none';
 try{Object.assign(v,JSON.parse(localStorage.getItem('whoGoneVol')||'{}'))}catch(e){}
 const mf=m=>440*2**((m-69)/12),rd=a=>a[Math.random()*a.length|0];
 function apply(){if(!ctx)return;const t=ctx.currentTime;MB.gain.setTargetAtTime(v.mute?0:v.m*.55,t,.05);SB.gain.setTargetAtTime(v.mute?0:v.s,t,.05)}
 function init(){

  ctx=new C();const m=ctx.createGain(),cp=ctx.createDynamicsCompressor();m.connect(cp);cp.connect(ctx.destination);
  MB=ctx.createGain();SB=ctx.createGain();MB.connect(m);SB.connect(m);
  rev=ctx.createConvolver();const L=ctx.sampleRate*2,ib=ctx.createBuffer(2,L,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ib.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*(1-i/L)**3}

  nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

 function osc(type,f,t,d,g,dest,o={}){

  if(o.f2)x.frequency.exponentialRampToValueAtTime(o.f2,t+d);if(o.det)x.detune.value=o.det;
  e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(g,t+(o.atk||.01));e.gain.exponentialRampToValueAtTime(.0001,t+d);

 const T={
  calm:{bpm:56,step(i,t,d,sd){

   if(Math.random()<.22)osc('sine',mf(rd([69,72,74,76,79,81])),t,2,.07,d,{atk:.02});
  }},
  shuffle:{bpm:132,step(i,t,d,sd){
   const b=(i/16|0)%4,root=[38,34,41,36][b],iv=b==0?[0,3,7]:[0,4,7],s=i%8;

 function go(n){

  const tr=T[n],o={n,bus};let i=0,nt=t+.6;
  const run=()=>{if(nt<ctx.currentTime)nt=ctx.currentTime+.05;while(nt<ctx.currentTime+.4){const sd=tr.sd?tr.sd(i):60/tr.bpm/2;tr.step(i,nt,bus,sd);nt+=sd;i++}};
  run();o.iv=setInterval(run,90);cur=o;
 }
 /* אפקטים */
 const FX={
  start(t){noise(t,.7,.18,SB,{type:'bandpass',f:300,f2:6000,atk:.5});
   [60,64,67,72,76].forEach((n,k)=>{osc('square',mf(n),t+.1+k*.07,.3,.07,SB,{lp:3000});osc('triangle',mf(n-12),t+.1+k*.07,.3,.1,SB)});
   [48,55,60,64,72].forEach(n=>osc('sawtooth',mf(n),t+.5,1.2,.06,SB,{lp:2500}));osc('sine',100,t+.5,.8,.6,SB,{f2:35})},
  correct(t){[72,76,79,84,88].forEach((n,k)=>{osc('triangle',mf(n),t+k*.08,.7,.14,SB);osc('sine',mf(n+12),t+k*.08,.5,.05,SB)});noise(t+.3,.5,.05,SB,{f:8000})},
  wrong(t){osc('sawtooth',230,t,.35,.2,SB,{f2:110,lp:900});osc('sawtooth',185,t+.2,.5,.2,SB,{f2:80,lp:700});osc('sine',90,t,.4,.4,SB,{f2:40})},
  vanish(t){noise(t,.6,.25,SB,{type:'bandpass',f:200,f2:5000,atk:.5});osc('sine',110,t+.45,1.4,.7,SB,{f2:28});
   noise(t+.45,.9,.3,SB,{type:'lowpass',f:3000,f2:150,atk:.01});osc('sawtooth',900,t+.45,.9,.08,SB,{f2:60,lp:2000});osc('sine',mf(93),t+.5,1.5,.05,SB)},
  select(t){osc('sine',880,t,.07,.1,SB,{atk:.003})},
  tick(t){osc('sine',1400,t,.05,.1,SB,{atk:.003})},
  win(t){[60,64,67,72,76,79,84].forEach((n,k)=>osc('triangle',mf(n),t+k*.09,.8,.15,SB));
   [60,67,72,76,84].forEach(n=>osc('square',mf(n),t+.7,1.6,.06,SB,{lp:3000}));noise(t+.7,.8,.06,SB,{f:8000})},
  lose(t){osc('sine',100,t,1.6,.7,SB,{f2:30});[57,53,50,45].forEach((n,k)=>osc('sawtooth',mf(n),t+k*.35,.9,.09,SB,{lp:700}))}
 };
 return{v,init,go,
  sfx(n){init();if(!ctx||v.mute)return;FX[n](ctx.currentTime+.02)},
  phase(p){go({observe:'calm',shuffle:'shuffle',answer:'tense'}[p]||'none')},
  set(o){Object.assign(v,o);apply();try{localStorage.setItem('whoGoneVol',JSON.stringify(v))}catch(e){}}};
})();
function syncAudio(){
 const v=A.v;$('mvl').value=Math.round(v.m*100);$('svl').value=Math.round(v.s*100);$('mute').checked=v.mute;
 $('mvlb').textContent='עוצמת מוזיקה: '+Math.round(v.m*100)+'%';$('svlb').textContent='עוצמת אפקטים: '+Math.round(v.s*100)+'%';
 $('mt').textContent=v.mute?'🔇':'🔊';
}
$('mvl').oninput=e=>{A.set({m:e.target.value/100});syncAudio()};
$('svl').oninput=e=>{A.set({s:e.target.value/100});syncAudio()};
$('svl').onchange=()=>A.sfx('correct');
$('mute').onchange=e=>{A.set({mute:e.target.checked});syncAudio()};
$('mt').onclick=()=>{A.set({mute:!A.v.mute});syncAudio()};
document.addEventListener('pointerdown',()=>{A.init();if(S.phase=='menu')A.go('calm')});

/* ---------- תפריט ---------- */
function buildMenu(){
 $('lvs').innerHTML=LV.map((l,i)=>`<button class="lv${i==S.lv?' on':''}" data-i="${i}"><b>${l.n}</b><span>${l.l}</span><small>שיא: ${S.best[i]||0}</small></button>`).join('');
 const L=LV[S.lv],c=$('cnt');c.min=L.min;c.max=L.max;if(S.cnt<L.min||S.cnt>L.max)S.cnt=L.min;c.value=S.cnt;
 c.disabled=S.auto;$('obl').textContent='זמן התבוננות: '+S.obs+' שניות';$('cnl').textContent='מספר דמויות: '+(S.auto?'אוטומטי':S.cnt);syncAudio();
}
$('lvs').onclick=e=>{const b=e.target.closest('.lv');if(b){S.lv=+b.dataset.i;buildMenu()}};
$('obs').oninput=e=>{S.obs=+e.target.value;buildMenu()};
$('cnt').oninput=e=>{S.cnt=+e.target.value;buildMenu()};
$('auto').onchange=e=>{S.auto=e.target.checked;buildMenu()};
$('go').onclick=newGame;$('again').onclick=newGame;
$('tomenu').onclick=toMenu;$('mn').onclick=toMenu;
function toMenu(){S.run++;S.phase='menu';A.go('calm');$('over').classList.add('hide');buildMenu();$('menu').classList.remove('hide')}
function newGame(){Object.assign(S,{round:1,score:0,combo:0,lives:3,startBest:S.best[S.lv]||0});A.init();A.sfx('start');$('menu').classList.add('hide');$('over').classList.add('hide');hud();play()}
function hud(){$('sc').textContent=S.score;$('rd').textContent=S.round;$('lvn').textContent=LV[S.lv].n;$('cb').textContent='×'+S.combo;$('lf').textContent='❤️'.repeat(Math.max(0,S.lives))||'—';$('bs').textContent=S.best[S.lv]||0}

/* ---------- דמויות ופריסה ---------- */
function roster(n){
 const nm=shuffle(NAMES),off=Math.random()*360,im=shuffle(Array.from({length:n},(_,i)=>i%IMGS.length));
 return shuffle(Array.from({length:n},(_,i)=>{const g=i/nm.length|0;return{name:nm[i%nm.length]+(g?' '+LET[g-1]+'׳':''),img:im[i],h:(off+i*137.508)%360,slot:0,miss:false}})).map((c,i)=>(c.slot=i,c));
}
function computeG(n){
 const W=stage.clientWidth,H=stage.clientHeight;let b=null;
 for(let c=1;c<=n;c++){const r=Math.ceil(n/c),sw=W/c,sh=H/r,d=Math.min(sw*.84,sh/1.3);if(!b||d>b.raw)b={c,sw,sh,raw:d}}
 b.d=Math.min(b.raw,130);b.nm=b.d>=38;b.bw=Math.min(b.sw,b.d*1.3);b.bh=b.d*(b.nm?1.3:1.02);
 stage.style.setProperty('--d',b.d+'px');stage.style.setProperty('--bw',b.bw+'px');stage.style.setProperty('--fs',Math.max(9,b.d*.2)+'px');
 stage.classList.toggle('nonm',!b.nm);return G=b;
}
function pos(R,j=1){
 const {c,sw,sh,bw,bh}=G,W=stage.clientWidth,H=stage.clientHeight,rows=Math.ceil(R/c),oy=(H-rows*sh)/2,out=[];
 const jx=Math.max(0,(sw-bw)/2)*.8*j,jy=Math.max(0,(sh-bh)/2)*.8*j;
 for(let k=0;k<R;k++){const col=k%c,row=k/c|0,inRow=row==rows-1?R-row*c:c,ox=(W-inRow*sw)/2;
  out.push({x:ox+col*sw+sw/2-bw/2+(Math.random()*2-1)*jx,y:oy+row*sh+sh/2-bh/2+(Math.random()*2-1)*jy})}
 return out;
}
function place(P,dur,st=0){
 stage.style.setProperty('--t',dur+'ms');
 S.chars.forEach((c,i)=>{const p=P[i];if(!p)return;c.el.style.transitionDelay=(st?Math.random()*st:0)+'ms';c.el.style.transform=`translate(${p.x}px,${p.y}px)`});
}
const bySlot=(P)=>S.chars.map(c=>P[c.slot]);
function sunflower(){
 const W=stage.clientWidth,H=stage.clientHeight,N=S.chars.length,R=Math.min(W,H)*.4,rot=Math.random()*6;
 return S.chars.map((c,i)=>{const a=i*2.39996+rot,r=R*Math.sqrt((i+.5)/N);return{x:W/2+Math.cos(a)*r*1.25-G.bw/2,y:H/2+Math.sin(a)*r-G.bh/2}});
}
function relayout(){
 if(!S.chars.length||!['observe','answer','result'].includes(S.phase))return;
 computeG(S.chars.length);const alive=S.chars.filter(c=>!c.miss||S.phase=='result');
 const P=pos(S.phase=='answer'?S.chars.length-S.miss.length:S.chars.length,.6);place(bySlot(P),300);
}
let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(relayout,90)}).observe(stage);

/* ---------- זרימת המשחק ---------- */
function level(){
 const L=LV[S.lv],r=S.round,st=Math.max(1,Math.round((L.max-L.min)/6));
 const n=S.auto?Math.min(L.max,L.min+(r-1)*st):S.cnt;
 return{n,m:Math.max(1,Math.min(1+((r-1)/3|0),3,n>>2)),t:Math.max(5,Math.round(S.obs*Math.max(.4,1-.06*(r-1))))};
}
function phase(p,txt){S.phase=p;A.phase(p);$('status').textContent=txt;$('tm').classList.toggle('hide',p!='observe');if(p!='answer'&&p!='result')$('ans').classList.add('hide')}
async function play(){
 const tok=++S.run,ck=()=>{if(tok!==S.run)throw 0};
 try{
  hud();const {n,m,t}=level();
  phase('setup','מכינים את הדמויות...');
  stage.className='';stage.innerHTML='';S.chars=roster(n);S.miss=[];S.sel.clear();computeG(n);
  S.chars.forEach(c=>{const e=document.createElement('div');e.className='ch in';e.style.setProperty('--dl',(Math.random()*-3)+'s');
   e.innerHTML=`<div class="av"><img src="${IMGS[c.img]}" alt="${c.name}" draggable="false"></div><div class="nm">${c.name}</div>`;
   c.el=e;stage.appendChild(e)});
  stage.style.setProperty('--t','0ms');place(bySlot(pos(n,1)),0);
  await wait(60);ck();
  S.chars.forEach((c,i)=>{c.el.style.transitionDelay=(i*500/n)+'ms';c.el.classList.remove('in')});
  await wait(700+500);ck();
  /* התבוננות */
  S.chars.forEach(c=>c.el.style.transitionDelay='0ms');
  if(n<=40)stage.classList.add('float');
  phase('observe','זכרו את כל הדמויות! ('+n+' דמויות)');
  const end=Date.now()+t*1000;let done=false;S.skip=()=>done=true;
  while(!done&&Date.now()<end){ck();const left=(end-Date.now())/1000;const sl=Math.ceil(left);if(sl!=$('tn').textContent&&sl<=5)A.sfx('tick');$('tn').textContent=sl;$('tb').style.transform=`scaleX(${left/t})`;$('tm').classList.toggle('low',left<=5);await wait(100)}
  stage.classList.remove('float');
  /* ערבוב */
  phase('shuffle','מערבבים... עקבו אחרי הדמויות!');
  const steps=4+Math.min(4,S.round>>1),dur=Math.max(520,1000-S.round*45);
  for(let s=0;s<steps;s++){
   ck();
   if(s==1&&n>=8){place(sunflower(),dur+200,160);await wait(dur+420)}
   else{S.shuffleSlots=shuffle(S.chars.map((_,i)=>i));S.chars.forEach((c,i)=>c.slot=S.shuffleSlots[i]);place(bySlot(pos(n,1)),dur,s%2?260:90);await wait(dur+300)}
  }
  ck();S.chars.forEach((c,i)=>c.slot=S.shuffleSlots?S.shuffleSlots[i]:i);place(bySlot(pos(n,1)),dur);await wait(dur+350);ck();
  /* היעלמות */
  phase('vanish','רגע... משהו קרה!');
  await wait(350);ck();
  S.miss=shuffle(S.chars).slice(0,m);S.miss.forEach(c=>c.miss=true);
  S.chars.forEach(c=>c.el.style.transitionDelay='0ms');
  for(const c of S.miss){A.sfx('vanish');c.el.classList.add('gone');await wait(450)}
  await wait(700);ck();
  const rest=S.chars.filter(c=>!c.miss),ord=shuffle(rest.map((_,i)=>i));
  rest.forEach((c,i)=>c.slot=ord[i]);S.miss.forEach(c=>c.slot=-1);
  const P=pos(rest.length,1);place(S.chars.map(c=>c.miss?null:P[c.slot]),700,120);
  await wait(1000);ck();
  identify(n,m);
 }catch(e){if(e!==0)console.error(e)}
}

function avHTML(c,d){return `<div class="av" style="--d:${d}px"><img src="${IMGS[c.img]}" alt="" draggable="false"></div>`}
function identify(n,m){
 phase('answer',m>1?`נעלמו ${m} דמויות!`:'דמות אחת נעלמה!');
 $('q').textContent=m>1?`מי נעלמו? בחרו ${m} דמויות`:'מי נעלם?';
 const total=Math.min(n,6+S.lv*2+(m-1)*2),dec=shuffle(S.chars.filter(c=>!c.miss)).slice(0,total-m);
 const opts=shuffle([...S.miss,...dec]);
 $('opts').innerHTML=opts.map(c=>`<button class="opt" data-i="${S.chars.indexOf(c)}">${avHTML(c,58)}<span>${c.name}</span></button>`).join('');
 $('opts').classList.remove('hide');$('res').classList.add('hide');$('ans').classList.remove('hide');
 S.m=m;S.n=n;
}
$('opts').onclick=e=>{
 const b=e.target.closest('.opt');if(!b||S.phase!='answer')return;const i=+b.dataset.i;A.sfx('select');
 if(S.sel.has(i)){S.sel.delete(i);b.classList.remove('sel')}else{S.sel.add(i);b.classList.add('sel')}
 if(S.sel.size==S.m)submit();
};
function submit(){
 phase('result','');const m=S.m,n=S.n,picks=[...S.sel],hit=picks.filter(i=>S.chars[i].miss).length,ok=hit==m;
 const base=Math.round((40+n*4)*LV[S.lv].m);let pts=0,cls,title,sub;
 if(ok){S.combo++;pts=Math.round(base*(1+.25*(S.combo-1)));cls='good';title='כל הכבוד! צדקת 🎉';sub=S.combo>1?`קומבו ×${S.combo}!`:'תשובה נכונה'}
 else{if(hit>0)pts=Math.round(base*hit/m*.5);S.combo=0;S.lives--;cls='badm';title=hit>0?'כמעט! זיהית רק חלק':'טעות!';sub='הנעלמים היו: '+S.miss.map(c=>c.name).join(', ')}
 S.score+=pts;if(S.score>(S.best[S.lv]||0)){S.best[S.lv]=S.score;saveBest()}A.sfx(ok?'correct':'wrong');
 document.querySelectorAll('.opt').forEach(b=>{const c=S.chars[+b.dataset.i],p=S.sel.has(+b.dataset.i);b.classList.remove('sel');
  if(p)b.classList.add(c.miss?'ok':'no');else if(c.miss)b.classList.add('miss')});
 $('opts').classList.remove('hide');$('res').classList.remove('hide');$('res').className=cls;
 $('msg').innerHTML=`<b>${title}</b>${sub}<br>${pts>0?'+'+pts+' נקודות':'ללא נקודות'}`;
 $('nx').textContent=S.lives<=0?'לסיכום המשחק':'הסיבוב הבא';
 /* חשיפה */
 S.chars.forEach((c,i)=>c.slot=i);S.miss.forEach(c=>{c.el.style.transitionDelay='0ms';c.el.classList.remove('gone');c.el.classList.add('rev')});
 place(bySlot(pos(S.chars.length,.5)),700,0);hud();
}
$('nx').onclick=()=>{
 if(S.lives<=0){
  S.phase='over';const win=(S.score>0&&S.score>(S.startBest||0))||S.round>=6;A.go(win?'win':'lose');A.sfx(win?'win':'lose');$('over').querySelector('h1').textContent=win?'כל הכבוד! ניצחון!':'המשחק נגמר';$('ovt').textContent=`הגעתם עד סיבוב ${S.round} ברמה ${LV[S.lv].n}`;$('ovs').textContent=S.score+' נקודות';
  $('ovb').textContent=S.score>0&&S.score>=(S.best[S.lv]||0)?'🏆 שיא אישי חדש!':'השיא האישי שלכם: '+(S.best[S.lv]||0);$('over').classList.remove('hide');
 }else{S.round++;play()}
};
$('skip').onclick=()=>S.skip&&S.skip();
buildMenu();hud();
</script>
